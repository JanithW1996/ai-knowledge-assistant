name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Validate and test
    runs-on: ubuntu-latest

    env:
      APP_ENVIRONMENT: test
      IDENTITY_MODE: demo
      DOCUMENT_REPOSITORY: local

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate synthetic dataset
        run: python src/validate_data.py

      - name: Run automated tests
        run: python -m pytest

      - name: Check application syntax
        run: >
          python -m py_compile
          src/api.py
          src/runtime_security.py
          src/adapters/azure/blob_document_repository.py